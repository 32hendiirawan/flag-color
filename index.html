<!DOCTYPE html>
<html lang="id">

  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    #svg-container svg, #feedback-flag-container svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      border-radius: 0.75rem;
    }
    
    /* Custom Styling Bendera */
    .flag-path {
      cursor: pointer;
      transition: fill 0.2s ease, stroke-opacity 0.2s ease;
      stroke: #94a3b8 !important; /* Stroke tipis Slate-400 */
      stroke-width: 0.5px !important;
      vector-effect: non-scaling-stroke;
    }
    
    .flag-path:hover {
      filter: brightness(0.95);
      stroke: #475569 !important;
      stroke-width: 0.5px !important;
    }

    .static-color, .static-color *, .fixed, .fixed * {
      pointer-events: none !important;
      cursor: default !important;
    }
  </style>
</head>

      <div>

      </div>

    </div>

      Mengecek data...
    </div>

      <h1 class="text-base sm:text-lg font-black text-slate-800 leading-tight px-1 truncate" id="country-title">Loading...</h1>
    </div>

    <!-- Container Utama SVG Bendera -->

    </div>

    </div>

    const checkBtn = document.getElementById("check-btn");
    const resetBtn = document.getElementById("reset-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    
    const feedbackMessage = document.getElementById("feedback-message");
    const feedbackBadge = document.getElementById("feedback-badge");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackText = document.getElementById("feedback-text");
    const feedbackFlagContainer = document.getElementById("feedback-flag-container");
    const feedbackCountryName = document.getElementById("feedback-country-name");

    function loadStorage() {
      try {
        const saved = localStorage.getItem("flag_quiz_progress_v2");
        if (saved) {
          const parsed = JSON.parse(saved);
          completedFlags = parsed.completedFlags || {};
          currentFlagIndex = parsed.currentFlagIndex || 0;
          return true;
        }
      } catch (e) {
        console.error(e);
      }
      return false;
    }

    function saveStorage() {
      localStorage.setItem("flag_quiz_progress_v2", JSON.stringify({
        completedFlags: completedFlags,
        currentFlagIndex: currentFlagIndex
      }));
    }

    function refreshHomeUI() {
      const hasData = loadStorage();
      const count = Object.keys(completedFlags).length;

      if (hasData && count > 0) {
        btnContinue.disabled = false;
        progressInfo.innerText = `${count} / ${countriesList.length} Flags Completed`;
      } else {
        btnContinue.disabled = true;
        progressInfo.innerText = "No progress saved yet.";
      }
    }

    // Perekaman warna asli dari seluruh part SVG saat dimuat pertama kali
    function extractMasterOriginalColors() {
      if (!svgElement) return;
      masterOriginalColors = {};

      countriesList.forEach(country => {
        const group = svgElement.querySelector(`g#${country.id}`);
        if (!group) return;
        
        const paths = group.querySelectorAll("path, rect, circle, polygon, ellipse");
        paths.forEach((p, idx) => {
          if (!p.id) p.id = `${country.id}-part-${idx}`;
          
          let rawFill = p.getAttribute("fill");
          if (!rawFill || rawFill === "none") {
            rawFill = window.getComputedStyle(p).fill;
          }
          masterOriginalColors[p.id] = rgbToHex(rawFill);
        });
      });
    }

    async function prepareSvg() {
      if (svgElement) return;
      
      try {
        const res = await fetch("bendera.svg");
        if (!res.ok) throw new Error("File bendera.svg tidak ada");
        const svgText = await res.text();
        svgContainer.innerHTML = svgText;
      } catch (err) {
        svgContainer.innerHTML = fallbackSvgContent;
      }
      svgElement = svgContainer.querySelector("svg");
      extractMasterOriginalColors();
    }

    async function launchGame(isContinueMode) {
      screenHome.classList.add("hidden");
      screenEnd.classList.add("hidden");
      screenGame.classList.remove("hidden");

      await prepareSvg();

      if (!isContinueMode) {
        completedFlags = {};
        currentFlagIndex = 0;
        saveStorage();
      } else {
        loadStorage();
      }

      setTimeout(() => {
        loadFlagByIndex(currentFlagIndex);
      }, 50);
    }

    function showHomeScreen() {
      refreshHomeUI();
      screenGame.classList.add("hidden");
      screenEnd.classList.add("hidden");
      screenHome.classList.remove("hidden");
    }

    function showEndScreen() {
      screenGame.classList.add("hidden");
      screenHome.classList.add("hidden");
      screenEnd.classList.remove("hidden");
      const count = Object.keys(completedFlags).length;
      endScoreText.innerText = `${count} / ${countriesList.length} Flags`;
    }

    function getFillablePaths(groupElement) {
      if (!groupElement) return [];
      const paths = groupElement.querySelectorAll("path, rect, circle, polygon, ellipse");
      return Array.from(paths).filter(p => 
        !p.classList.contains("static-color") && 
        !p.closest(".static-color") &&
        !p.classList.contains("fixed") && 
        !p.closest(".fixed")
      );
    }

    function loadFlagByIndex(index) {
      if (!svgElement) return;

      const country = countriesList[index] || countriesList[0];
      countryTitle.innerText = country.name;
      hideFeedback();
      userColors = {};
      originalColors = {};
      selectedColor = null;

      const allGroups = svgElement.querySelectorAll("g[id]");
      allGroups.forEach(g => g.style.display = "none");

      let targetGroup = svgElement.querySelector(`g#${country.id}`);
      if (!targetGroup && allGroups.length > 0) {
        targetGroup = allGroups[0];
      }

      if (!targetGroup) return;

      targetGroup.style.display = "inline";
      const childGroups = targetGroup.querySelectorAll("g");
      childGroups.forEach(g => g.style.display = "inline");

      const fillablePaths = getFillablePaths(targetGroup);

      fillablePaths.forEach((path, idx) => {
        if (!path.id) path.id = `${country.id}-part-${idx}`;

        let hexColor = masterOriginalColors[path.id];
        if (!hexColor || hexColor === DEFAULT_GRAY) {
          let rawFill = path.getAttribute("fill") || window.getComputedStyle(path).fill;
          hexColor = rgbToHex(rawFill);
        }

        originalColors[path.id] = hexColor;
        path.classList.add("flag-path");
        
        path.style.fill = DEFAULT_GRAY; 
        path.onclick = onPathClick;
      });

      requestAnimationFrame(() => {
        try {
          const bbox = targetGroup.getBBox();
          const pad = 5;
          svgElement.setAttribute(
            "viewBox", 
            `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + (pad * 2)} ${bbox.height + (pad * 2)}`
          );
        } catch(e) {
          console.error("Gagal membaca BBox bendera:", e);
        }
      });

      renderPalette();
      updateNavButtons();
      updateCheckButton(fillablePaths);
    }

    function updateNavButtons() {
      prevBtn.disabled = currentFlagIndex === 0;
      const currentCountry = countriesList[currentFlagIndex];
      const isDone = completedFlags[currentCountry.id] === true;
      nextBtn.disabled = !isDone;
    }

    function renderPalette() {
      colorPalette.innerHTML = "";
      const uniqueColors = Array.from(new Set(Object.values(originalColors)));
      const shuffled = uniqueColors.sort(() => Math.random() - 0.5);

      shuffled.forEach((color, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-white shadow-md transform hover:scale-110 transition flex items-center justify-center flex-shrink-0 cursor-pointer`;
        btn.style.backgroundColor = color;
        
        if (idx === 0) selectPaletteColor(color, btn);
        btn.onclick = () => selectPaletteColor(color, btn);
        colorPalette.appendChild(btn);
      });
    }

    function selectPaletteColor(color, element) {
      selectedColor = color;
      Array.from(colorPalette.children).forEach(child => {
        child.classList.remove("ring-4", "ring-indigo-500", "scale-110");
      });
      element.classList.add("ring-4", "ring-indigo-500", "scale-110");
    }

    function onPathClick(e) {
      if (!selectedColor) return;
      const path = e.target;
      path.style.fill = selectedColor;
      userColors[path.id] = selectedColor;

      const currentCountry = countriesList[currentFlagIndex];
      const activeGroup = svgElement.querySelector(`g#${currentCountry.id}`) || svgElement.querySelector("g");
      const fillablePaths = getFillablePaths(activeGroup);
      updateCheckButton(fillablePaths);
    }

    function updateCheckButton(fillablePaths) {
      const isAllColored = fillablePaths.length > 0 && fillablePaths.every(p => userColors[p.id]);
      checkBtn.disabled = !isAllColored;
    }

    function renderCorrectFlagPreview(countryId) {
      feedbackFlagContainer.innerHTML = "";
      if (!svgElement) return;

      // Clone SVG utama untuk preview
      const svgClone = svgElement.cloneNode(true);
      const allGroups = svgClone.querySelectorAll("g[id]");
      allGroups.forEach(g => g.style.display = "none");

      const targetGroup = svgClone.querySelector(`g#${countryId}`);
      if (targetGroup) {
        targetGroup.style.display = "inline";
        const childGroups = targetGroup.querySelectorAll("g");
        childGroups.forEach(g => g.style.display = "inline");

        const fillablePaths = getFillablePaths(targetGroup);
        fillablePaths.forEach(path => {
          const originalColor = masterOriginalColors[path.id] || originalColors[path.id];
          if (originalColor) {
            path.style.fill = originalColor;
          }
        });

        try {
          const origGroup = svgElement.querySelector(`g#${countryId}`);
          const bbox = origGroup ? origGroup.getBBox() : targetGroup.getBBox();
          const pad = 2; // Sedikit padding agar terfokus penuh
          svgClone.setAttribute(
            "viewBox", 
            `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + (pad * 2)} ${bbox.height + (pad * 2)}`
          );
        } catch(e) {}
      }

      feedbackFlagContainer.appendChild(svgClone);
    }

    function showFeedback(isCorrect) {
      if (feedbackTimeout) clearTimeout(feedbackTimeout);

      const currentCountry = countriesList[currentFlagIndex] || { id: "", name: "" };

      if (isCorrect) {
        feedbackBadge.className = "px-6 py-6 rounded-3xl font-extrabold text-xl shadow-2xl flex flex-col items-center gap-3 border bg-emerald-500 text-white border-emerald-400 max-w-[300px] w-full text-center";
        feedbackIcon.innerHTML = `<i class="fi fi-rr-badge-check text-5xl animate-bounce"></i>`;
        feedbackText.innerText = "Correct!";
        
        // Render Preview Bendera Asli Tanpa Container Box
        renderCorrectFlagPreview(currentCountry.id);
        feedbackFlagContainer.classList.remove("hidden");
        feedbackCountryName.innerText = currentCountry.name;
        feedbackCountryName.classList.remove("hidden");

        completedFlags[currentCountry.id] = true;
        saveStorage();
        updateNavButtons();
      } else {
        feedbackBadge.className = "px-6 py-6 rounded-3xl font-extrabold text-xl shadow-2xl flex flex-col items-center gap-3 border bg-rose-500 text-white border-rose-400 max-w-[300px] w-full text-center";
        feedbackIcon.innerHTML = `<i class="fi fi-rr-cross-circle text-5xl animate-bounce"></i>`;
        feedbackText.innerText = "Jawaban Salah!";
        
        feedbackFlagContainer.classList.add("hidden");
        feedbackCountryName.classList.add("hidden");
      }

      feedbackMessage.classList.remove("hidden");
      setTimeout(() => {
        feedbackMessage.classList.remove("opacity-0", "scale-90");
        feedbackMessage.classList.add("opacity-100", "scale-100");
      }, 10);

      feedbackTimeout = setTimeout(() => {
        hideFeedback();
        if (isCorrect) {
          if (currentFlagIndex < countriesList.length - 1) {
            currentFlagIndex++;
            saveStorage();
            loadFlagByIndex(currentFlagIndex);
          } else {
            showEndScreen();
          }
        }
      }, 2000);
    }

    function hideFeedback() {
      feedbackMessage.classList.remove("opacity-100", "scale-100");
      feedbackMessage.classList.add("opacity-0", "scale-90");
      setTimeout(() => {
        feedbackMessage.classList.add("hidden");
      }, 300);
    }

    // Event Binds
    btnStartNew.addEventListener("click", () => launchGame(false));
    btnContinue.addEventListener("click", () => launchGame(true));
    btnBackHome.addEventListener("click", showHomeScreen);
    btnRestartGame.addEventListener("click", () => launchGame(false));
    btnEndHome.addEventListener("click", showHomeScreen);

    checkBtn.addEventListener("click", () => {
      const currentCountry = countriesList[currentFlagIndex];
      const activeGroup = svgElement.querySelector(`g#${currentCountry.id}`) || svgElement.querySelector("g");
      const fillablePaths = getFillablePaths(activeGroup);
      let isCorrect = true;

      fillablePaths.forEach(path => {
        const correctColor = (originalColors[path.id] || "").toUpperCase();
        const userColor = (userColors[path.id] || "").toUpperCase();
        if (correctColor !== userColor) isCorrect = false;
      });

      showFeedback(isCorrect);
    });

    resetBtn.addEventListener("click", () => {
      const currentCountry = countriesList[currentFlagIndex];
      const activeGroup = svgElement.querySelector(`g#${currentCountry.id}`) || svgElement.querySelector("g");
      if (activeGroup) {
        const fillablePaths = getFillablePaths(activeGroup);
        fillablePaths.forEach(p => p.style.fill = DEFAULT_GRAY);
        userColors = {};
        updateCheckButton(fillablePaths);
        hideFeedback();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentFlagIndex > 0) {
        currentFlagIndex--;
        saveStorage();
        loadFlagByIndex(currentFlagIndex);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentFlagIndex < countriesList.length - 1) {
        currentFlagIndex++;
        saveStorage();
        loadFlagByIndex(currentFlagIndex);
      } else if (completedFlags[countriesList[currentFlagIndex].id]) {
        showEndScreen();
      }
    });

    function rgbToHex(rgb) {
      if (!rgb || rgb === "none") return "#FFFFFF";
      if (rgb.startsWith("#")) return rgb.toUpperCase();
      const values = rgb.match(/\d+/g);
      if (!values || values.length < 3) return "#FFFFFF";
      return "#" + values.slice(0, 3).map(x => {
        const hex = parseInt(x).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join("").toUpperCase();
    }

    refreshHomeUI();

    // GLOBAL BULLETPROOF SECURITY LAYER
    (function() {
        window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
        }, true);
    })();    
  </script>
</body>
</html>
